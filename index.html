<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="A private password generator that runs entirely in your browser.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#e4e7ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
    <title>Password Generator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c2128'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%233d5a73'/%3E%3C/svg%3E">
    <meta http-equiv="Cache-Control" content="no-cache">
    <link rel="stylesheet" href="styles.css?v=__COMMIT_SHA__">
  </head>
  <body>
    <main>
      <header>
        <div class="title-block">
          <h1>Password Generator</h1>
        </div>
        <p class="lede">Set the length and character mix. Copy the result, or change any character by hand.</p>
      </header>

      <section class="panel" aria-label="Password generator">
        <div class="stage">
          <div class="password-row">
            <div class="tool-actions">
              <button type="button" id="generate" class="icon-btn primary" aria-label="Generate password">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 12a9 9 0 1 1-2.2-5.9"></path>
                  <path d="M21 3v6h-6"></path>
                </svg>
              </button>
              <button type="button" id="copy" class="icon-btn" aria-label="Copy password">
                <svg class="icon-copy" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                  <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
                </svg>
                <svg class="icon-check" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12.5 9.2 17 19 7"></path>
                </svg>
              </button>
            </div>
            <div class="field">
              <label class="sr-only" for="password">Password</label>
              <textarea
                id="password"
                rows="1"
                spellcheck="false"
                autocapitalize="off"
                autocorrect="off"
                autocomplete="off"
                translate="no"
                placeholder="Type or generate"
                data-lpignore="true"
                data-1p-ignore
              ></textarea>
            </div>
          </div>

          <div class="meta">
            <div class="meta-text">
              <div
                id="meter"
                class="meter"
                role="meter"
                aria-label="Password strength"
                aria-valuemin="0"
                aria-valuemax="128"
                aria-valuenow="0"
              >
                <span></span><span></span><span></span><span></span>
              </div>
              <p class="strength">
                <span id="strength-label" data-level="empty">Empty</span><span id="strength-detail"></span><span id="edited-flag" hidden> · Edited</span>
              </p>
            </div>
          </div>
        </div>

        <div class="workspace">
          <div class="length-block">
            <div class="length-top">
              <label for="length">Length</label>
              <div class="stepper">
                <button type="button" id="length-dec" aria-label="Decrease length">−</button>
                <output id="length-value" for="length">16</output>
                <button type="button" id="length-inc" aria-label="Increase length">+</button>
              </div>
            </div>
            <input id="length" type="range" min="8" max="64" step="1" value="16" aria-describedby="length-scale">
            <div class="scale" id="length-scale">
              <span>8</span>
              <span>64</span>
            </div>
          </div>

          <div class="options">
            <p class="options-label" id="include-label">Include</p>
            <div class="toggles" role="group" aria-labelledby="include-label">
              <label class="toggle">
                <span class="glyph" aria-hidden="true">abc</span>
                <span class="toggle-name">Lowercase</span>
                <input id="lower" type="checkbox" role="switch" checked>
                <span class="track" aria-hidden="true"><span class="thumb"></span></span>
              </label>
              <label class="toggle">
                <span class="glyph" aria-hidden="true">ABC</span>
                <span class="toggle-name">Uppercase</span>
                <input id="upper" type="checkbox" role="switch" checked>
                <span class="track" aria-hidden="true"><span class="thumb"></span></span>
              </label>
              <label class="toggle">
                <span class="glyph" aria-hidden="true">123</span>
                <span class="toggle-name">Numerals</span>
                <input id="digits" type="checkbox" role="switch" checked>
                <span class="track" aria-hidden="true"><span class="thumb"></span></span>
              </label>
              <label class="toggle">
                <span class="glyph" aria-hidden="true">#$</span>
                <span class="toggle-name">Special</span>
                <input id="symbols" type="checkbox" role="switch" checked>
                <span class="track" aria-hidden="true"><span class="thumb"></span></span>
              </label>
              <label class="toggle toggle-note">
                <span class="glyph" aria-hidden="true">01</span>
                <span class="toggle-copy">
                  <span class="toggle-name">Skip lookalikes</span>
                  <span class="hint" id="lookalikes-hint">Leaves out 0, O, 1, l, and I</span>
                </span>
                <input id="lookalikes" type="checkbox" role="switch" aria-describedby="lookalikes-hint">
                <span class="track" aria-hidden="true"><span class="thumb"></span></span>
              </label>
            </div>
          </div>

          <p id="notice" class="notice" role="alert" hidden></p>
        </div>
      </section>

      <p class="footnote">Generated in the browser with Web Crypto. The password never leaves this page.</p>
    </main>
    <p id="status" class="sr-only" aria-live="polite"></p>
    <script src="password.js?v=__COMMIT_SHA__"></script>
    <script src="app.js?v=__COMMIT_SHA__"></script>
  </body>
</html>
